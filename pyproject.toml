[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emoji-sequences"
version = "0.1.0"
description = "Split text into emoji sequences and plain-text runs, streaming-safe"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "michaelw894"}]

[tool.setuptools.packages.find]
where = ["src"]
